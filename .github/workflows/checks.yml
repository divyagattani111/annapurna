name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: isolated-ci-only-password
          POSTGRES_DB: family_ledger_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ledger -d family_ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ledger:isolated-ci-only-password@127.0.0.1:5432/family_ledger_test
      APP_MODE: test
      APP_ORIGIN: http://localhost:5173
      AUTH_BASE_URL: http://localhost:5173
      COOKIE_SECURE: 'false'
      BETTER_AUTH_SECRET: isolated-ci-only-secret-never-use-in-deployment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run db:migrate
      - run: bun run test:integration
      - run: bun run build
      - run: bun audit
