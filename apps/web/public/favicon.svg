  <rect x="25" y="18" width="18" height="3" rx="1.5" fill="#047857"/>
  <rect x="25" y="24" width="14" height="2.5" rx="1" fill="#94a3b8"/>
  <rect x="25" y="29" width="16" height="2.5" rx="1" fill="#94a3b8"/>
  <rect x="25" y="34" width="12" height="2.5" rx="1" fill="#94a3b8"/>
  <!-- Indian Rupee symbol badge -->
  <circle cx="44" cy="42" r="10" fill="#f59e0b"/>
  <text x="44" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
