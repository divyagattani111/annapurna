services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: family_ledger_test
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set private test password}
    volumes: [test_pg:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledger -d family_ledger_test']
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test_private]
  test:
    image: family-sales-ledger-api
    env_file: ../.local/container-test.env
    volumes: [../tests:/app/tests:ro]
    depends_on:
      db: {condition: service_healthy}
    networks: [test_private]
volumes:
  test_pg:
networks:
  test_private: {internal: true}
