name: family-sales-ledger
services:
  db:
    image: postgres:18.6-alpine
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: family_ledger_live
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a separate runtime database password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./grant-runtime.sql:/opt/ledger/grant-runtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledger_admin -d family_ledger_live']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfiles/api
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://ledger_app:${APP_DB_PASSWORD}@db:5432/family_ledger_live
      APP_MODE: live
      APP_ORIGIN: https://${DOMAIN:?Set the approved domain}
      AUTH_BASE_URL: https://${DOMAIN}
      COOKIE_SECURE: 'true'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret}
      ATTACHMENT_DIR: /data/private-files
      PORT: '3001'
      API_HOST: 0.0.0.0
      TRUST_PROXY_HEADER: 'true'
    volumes: [private_files:/data/private-files]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, bun, --no-env-file, -e, "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  migrate:
    profiles: [operations]
    image: family-sales-ledger-api
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://ledger_admin:${POSTGRES_PASSWORD}@db:5432/family_ledger_live
      APP_MODE: live
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    command: [bun, --no-env-file, packages/db/src/migrate.ts]
  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfiles/web
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443']
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    networks: [private, public]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  postgres_data:
  private_files:
  caddy_data:
  caddy_config:
networks:
  private: {internal: true}
  public:
